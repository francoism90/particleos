# Firewall configuration—nftables service reads from this file
L /etc/nftables.conf - - - - ../usr/lib/nftables/nftables.conf

# Kernel parameter configuration—sysctl reads from this directory
L /etc/sysctl.d - - - - ../usr/lib/sysctl.d

# Podman/containers configuration directory
L? /etc/containers
