#!/usr/sbin/nft -f

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback
        iifname "lo" accept

        # Allow established/related connections
        ct state established,related accept

        # Allow ICMP (IPv4 and essential ICMPv6)
        ip protocol icmp limit rate 1/second accept
        icmpv6 type { echo-request, echo-reply, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Allow SSH
        tcp dport 22 accept

        # Allow Caddy (HTTP/HTTPS + QUIC)
        tcp dport { http, https } accept
        udp dport 443 accept

        # Allow Syncthing
        tcp dport 22000 accept
        udp dport 22000 accept

        # Allow KDE Connect
        tcp dport 1714-1764 accept
        udp dport 1714-1764 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
